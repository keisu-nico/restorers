<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>修復士たちの懸命な努力</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
html,body{margin:0}
/* Layout: a dark walnut gallery wall; the painting is the stage, controls sit beneath it like a museum label */
:root{
  --wall:#1c1611; --wall-2:#261e17; --panel:#30261d; --line:#4a3b2c; --sel:#3d3022;
  --ink:#f0e6d2; --muted:#b4a486; --gilt:#cfa65b; --gilt-hi:#ddb66c; --gilt-ink:#1c1611;
  --alarm:#e0714f; --guide:rgba(255,255,255,.6);
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--wall);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  background-image:radial-gradient(ellipse at 50% -10%, #3a2d21 0%, transparent 60%);min-height:100%}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:.02em}
h1{font-size:clamp(28px,5vw,44px);line-height:1.2;font-weight:800}
h2{font-size:clamp(22px,3.6vw,30px);line-height:1.3}
h3{font-size:16px}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--gilt);font-weight:700}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
button{font-family:var(--body);font-size:15px;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--wall-2);color:var(--ink);padding:10px 16px;transition:background .15s,border-color .15s,transform .1s}
button:hover{border-color:var(--gilt)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
button.primary{background:var(--gilt);color:var(--gilt-ink);border-color:var(--gilt);font-weight:700}
button.primary:hover{background:var(--gilt-hi)}
button:disabled{opacity:.4;cursor:not-allowed}
button:disabled:hover{border-color:var(--line)}
input,select{font-family:var(--body);font-size:15px;background:var(--wall);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
/* Credit */
.credit{max-width:1000px;margin:40px auto 0;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.credit a{color:var(--gilt);text-decoration:none;border-bottom:1px solid transparent}
.credit a:hover,.credit a:focus-visible{border-bottom-color:var(--gilt)}
[hidden]{display:none!important}

/* Frame */
.frame{position:relative;padding:10px;background:linear-gradient(145deg,#8a6a35,#d8b56e 30%,#7a5a2a 55%,#c9a258 80%,#6e5124);border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.4)}
.frame>.inner{position:relative;background:#000;box-shadow:inset 0 0 0 2px rgba(0,0,0,.6)}
.plaque{font-size:12px;color:var(--muted);line-height:1.5}
.plaque b{font-family:var(--display);color:var(--ink);font-size:14px;font-weight:700}

/* Setup */
.setup{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:760px){.setup{grid-template-columns:minmax(0,1fr)}.setup .art{max-width:340px;margin:0 auto;width:100%}}
.art img{display:block;width:100%}
.gridover{position:absolute;inset:0;display:grid;pointer-events:none}
.gridover span{border:1px solid rgba(240,230,210,.35);font-size:10px;color:rgba(240,230,210,.85);padding:1px 3px;text-shadow:0 1px 2px #000;line-height:1.2}
.gridover span.plain{background:repeating-linear-gradient(45deg,rgba(240,230,210,.16) 0 4px,transparent 4px 10px);color:rgba(240,230,210,.5)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.work{display:flex;gap:10px;align-items:center;text-align:left;padding:8px;line-height:1.3}
.work img{width:44px;height:44px;object-fit:cover;border-radius:3px;flex:none}
.work small{display:block;color:var(--muted);font-size:11px}
.work[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--gilt);background:var(--sel);box-shadow:0 0 0 1px var(--gilt)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;font-variant-numeric:tabular-nums}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.players label{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.players input{flex:1;width:100%}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;padding:0;font-size:18px}
.stepper output{min-width:48px;text-align:center;font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.alloc{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.alloc b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.rules{font-size:13px;color:var(--muted);display:grid;gap:4px}
.rules ol{margin:0;padding:0}
.rules li{margin-left:1.2em}

/* Pass screen */
.pass{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.pass .who{font-family:var(--display);font-size:clamp(34px,7vw,60px);font-weight:800;line-height:1.15}
.pass .ban{font-size:14px;color:var(--muted);max-width:30em}

/* Draw */
.drawhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.timer{flex:1 1 200px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:var(--wall-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--gilt);width:100%;transition:width .25s linear}
.timer.hurry .bar i{background:var(--alarm)}
.timer output{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.timer.hurry output{color:var(--alarm)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.stage .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.box{position:relative;width:100%;max-width:100%}
.box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.box canvas.tile{inset:auto}
.box .ctx{filter:brightness(.45) saturate(.6)}
.box.peek canvas.tile{outline:1px solid var(--gilt);z-index:1}
.guide{position:absolute;pointer-events:none;z-index:2}
.guide::before,.guide::after{content:"";position:absolute}
.guide::before{left:50%;top:0;bottom:0;width:1px;background:repeating-linear-gradient(to bottom,var(--guide) 0 6px,transparent 6px 11px)}
.guide::after{top:50%;left:0;right:0;height:1px;background:repeating-linear-gradient(to right,var(--guide) 0 6px,transparent 6px 11px)}
.toggle{display:flex;align-items:center;gap:8px}
.sw-state{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--muted)}
.toggle[aria-pressed="true"]{border-color:var(--gilt);background:var(--sel);box-shadow:0 0 0 1px var(--gilt)}
.toggle[aria-pressed="true"] .sw-state{background:var(--gilt);color:var(--gilt-ink)}
#ref{cursor:crosshair}
#pad{touch-action:none;cursor:crosshair}
.refmeta{display:flex;gap:10px;align-items:center}
.mini{width:64px;flex:none;position:relative}
.mini img{display:block;width:100%;opacity:.75}
.mini .hl{position:absolute;outline:2px solid var(--gilt);box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cellname{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
@media (max-width:640px){
  .stage{grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:12px}
  .cellname{font-size:20px}
  .mini{width:44px}
}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:32px;height:32px;padding:0;border-radius:4px;border:2px solid var(--wall)}
.sw[aria-pressed="true"]{outline:2px solid var(--gilt);outline-offset:2px}
.paintbox{display:flex;flex-direction:column;gap:6px;min-width:0;flex-basis:100%}
.more{height:32px;padding:0 12px;font-size:13px;border-style:dashed}
.otherbox{flex-basis:100%;display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.famrow{display:flex;gap:10px;align-items:center}
.famname{width:4.5em;flex:none;font-size:12px;color:var(--muted)}
.sizes{display:flex;gap:6px}
.sizes button{width:40px;height:40px;padding:0;display:grid;place-items:center}
.sizes button[aria-pressed="true"],.tool[aria-pressed="true"]{border-color:var(--gilt);background:var(--sel)}
.sizes i{display:block;background:var(--ink)}
.hint{font-size:12px;color:var(--muted)}

/* Composite */
.board{position:relative;display:grid;width:100%;background:#000}
.cell{position:relative;overflow:hidden;border:0;padding:0;border-radius:0;background:transparent;outline:1px solid rgba(0,0,0,.25);outline-offset:-1px;min-width:0}
.cell img{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.cell .tag{position:absolute;left:3px;bottom:3px;right:3px;font-size:11px;font-weight:700;line-height:1.2;padding:2px 5px;border-radius:4px;color:#111;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.cell .coord{position:absolute;left:3px;top:2px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
.cell .mark{position:absolute;right:3px;top:2px;font-size:10px;font-weight:700;padding:1px 4px;border-radius:4px;background:rgba(0,0,0,.7);color:var(--ink)}
.board.g6 .cell .tag,.board.g6 .cell .mark{font-size:9px;padding:1px 3px}
.board.g6 .cell .coord{font-size:8px}
.cell.locked::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.4) 0 6px,transparent 6px 12px)}
.cell.picked{outline:3px solid var(--gilt);outline-offset:-3px}
.cell.flip{animation:flip .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{from{transform:perspective(500px) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.cell.flip{animation:none}.bar i{transition:none}}
.boardwrap{width:100%;margin:0 auto}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.05em}
td:first-child,th:first-child{text-align:left}
tr.top td{color:var(--gilt);font-weight:700}
td.total{font-family:var(--display);font-size:20px;font-weight:800}
.tablewrap{overflow-x:auto}
.center{text-align:center}
.bignum{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

/* Online additions */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:720px){.home{grid-template-columns:minmax(0,1fr)}}
.err{color:var(--alarm);font-size:14px}
.code{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:.18em;line-height:1}
.invite{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.invite input{flex:1 1 220px;font-size:13px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.member{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--wall-2);min-width:0}
.member span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member small{margin-left:auto;color:var(--muted);font-size:11px;flex:none}
.member.done{border-color:var(--gilt)}
.member.done small{color:var(--gilt)}
.summary{display:flex;gap:12px;align-items:center}
.summary img{width:72px;height:72px;object-fit:cover;border-radius:4px;flex:none}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--wall-2);border:1px solid var(--line)}
.status{font-size:12px;color:var(--muted)}
</style>
</head>

const PLAYER_COLORS=["#e6b84d","#7fb3d5","#e08a7a","#9cc98a","#c39be0","#f0d78c","#7fd1c4","#e7a5c8"];
const LETTERS="ABCDEF",MAX_PLAYERS=8;
const ROOM_PREFIX="shufukushi-v1-",CODE_CHARS="ABCDEFGHJKLMNPQRSTUVWXYZ";
const app=document.getElementById("app");

// ?server=host:port points PeerJS at a self-hosted signaling server (used for local testing)
const PEER_OPTS=(()=>{const s=new URLSearchParams(location.search).get("server");if(!s)return{debug:0};
  const [host,port]=s.split(":");return{host,port:+port||9000,path:"/",secure:false,debug:0}})();

/* ---------- Shared helpers ---------- */
const workOf=id=>WORKS.find(w=>w.id===id)||WORKS[0];
const cellName=(i,N)=>LETTERS[i%N]+(Math.floor(i/N)+1);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const h=html=>{app.innerHTML=html;window.scrollTo(0,0)};
const isPng=s=>typeof s==="string"&&s.startsWith("data:image/png;base64,")&&s.length<3e6;
const dot=(pi,size=12)=>{const s=typeof size==="number"?size+"px":size;return `<span class="dot" style="display:inline-block;width:${s};height:${s};vertical-align:middle;background:${PLAYER_COLORS[pi%8]}"></span>`};
// Everything below arrives from other players' browsers, so it is coerced to known shapes before use
function cleanSettings(s){s=s||{};return{work:workOf(String(s.work)).id,grid:[4,5,6].includes(s.grid)?s.grid:4,per:[1,2,3].includes(s.per)?s.per:1,
  seconds:[60,90,120,180].includes(s.seconds)?s.seconds:90,guide:!!s.guide,peek:!!s.peek}}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const loaded={};
function loadImages(){return Promise.all(WORKS.map(w=>new Promise(res=>{const im=new Image();im.onload=im.onerror=()=>{loaded[w.id]=im;res()};im.src=w.src})))}
function cropURL(work,N,i){
  const cw=work.w/N,ch=work.h/N,c=document.createElement("canvas");c.width=cw;c.height=ch;
  const x=c.getContext("2d");x.imageSmoothingEnabled=false;
  x.drawImage(loaded[work.id],(i%N)*cw,Math.floor(i/N)*ch,cw,ch,0,0,cw,ch);

}
const maxDrawn=N=>Math.floor(N*N*0.75);
const PLAIN_SHARE=0.85,plainCache={},pixelCache={};
function plainTiles(work,N){
  const key=work.id+N;if(plainCache[key])return plainCache[key];
  if(!pixelCache[work.id]){const c=document.createElement("canvas");c.width=work.w;c.height=work.h;
    const x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingEnabled=false;x.drawImage(loaded[work.id],0,0);
    pixelCache[work.id]=x.getImageData(0,0,work.w,work.h).data}
  const d=pixelCache[work.id],cw=work.w/N,ch=work.h/N,plain=new Set(),near=nearestOf(work.palette);
  for(let i=0;i<N*N;i++){const x0=(i%N)*cw,y0=Math.floor(i/N)*ch,count=new Map();let best=0;
    for(let y=y0;y<y0+ch;y++)for(let x=x0;x<x0+cw;x++){const p=(y*work.w+x)*4,k=near(d[p],d[p+1],d[p+2]),v=(count.get(k)||0)+1;count.set(k,v);if(v>best)best=v}
    if(best/(cw*ch)>=PLAIN_SHARE)plain.add(i)}
  return plainCache[key]=plain;
}
const assignable=(work,N)=>N*N-plainTiles(work,N).size;
const fits=(n,per,N,work)=>n*per<=Math.min(maxDrawn(N),assignable(work,N));

const rgbOf=hex=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
const lum=hex=>{const [r,g,b]=rgbOf(hex);return .299*r+.587*g+.114*b};
function hsl(hex){const [r,g,b]=rgbOf(hex).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  if(!d)return{h:0,s:0,l};const s=d/(1-Math.abs(2*l-1));let hh;
  if(mx===r)hh=((g-b)/d)%6;else if(mx===g)hh=(b-r)/d+2;else hh=(r-g)/d+4;return{h:(hh*60+360)%360,s,l}}
function colorFamilies(colors){
  const fam={gray:[],red:[],brown:[],yellow:[],green:[],blue:[]};
  colors.forEach(c=>{const {h,s}=hsl(c);
    if(s<.12)fam.gray.push(c);else if(h<20||h>=330)fam.red.push(c);else if(h<42)fam.brown.push(c);
    else if(h<70)fam.yellow.push(c);else if(h<170)fam.green.push(c);else fam.blue.push(c)});
  const names={gray:"灰・黒",red:"赤",brown:"茶・肌",yellow:"黄",green:"緑",blue:"青・紫"};
  return Object.keys(fam).filter(k=>fam[k].length).map(k=>({name:names[k],colors:fam[k].sort((a,b)=>lum(a)-lum(b))}));
}
// Some browsers (Brave, privacy modes) add slight noise when a page reads canvas pixels,
// so every pixel read is snapped to the nearest paint color instead of matched exactly
const nearCache={};
function nearestOf(palette){
  const key=palette.join(),hit=nearCache[key];if(hit)return hit;
  const rgb=palette.map(rgbOf),cache=new Map();
  return nearCache[key]=(r,g,b)=>{const k=(r<<16)|(g<<8)|b;let v=cache.get(k);if(v!==undefined)return v;let bd=1e9;v=0;
    for(let i=0;i<rgb.length;i++){const c=rgb[i],dd=(c[0]-r)**2+(c[1]-g)**2+(c[2]-b)**2;if(dd<bd){bd=dd;v=i}}
    cache.set(k,v);return v};
}
function tileColors(data,palette){
  const near=nearestOf(palette),count=new Array(palette.length).fill(0);
  for(let i=0;i<data.length;i+=4)count[near(data[i],data[i+1],data[i+2])]++;
  const total=data.length/4;
  const used=palette.map((c,i)=>[c,count[i]]).filter(([,n])=>n/total>=.005).sort((a,b)=>b[1]-a[1]).map(([c])=>c);
  return used.length?used:[palette[0]];
}
const maskCache={};
function discSpans(d){
  if(maskCache[d])return maskCache[d];
  const spans=[],r=d/2;
  for(let y=0;y<d;y++){let x0=-1,x1=-1;
    for(let x=0;x<d;x++){const dx=x+.5-r,dy=y+.5-r;if(dx*dx+dy*dy<=r*r+.01){if(x0<0)x0=x;x1=x}}
    if(x0>=0)spans.push([y,x0,x1-x0+1]);}
  return maskCache[d]=spans;
}

/* ---------- Host: room ---------- */
function createRoom(tries=0){
  const code=[...Array(4)].map(()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join("");
  renderConnecting("部屋を準備しています…");
  const peer=new Peer(ROOM_PREFIX+code,PEER_OPTS);
  peer.on("open",id=>{
    net={peer,isHost:true,code,conns:new Map()};me.id=id;
    L.players=[{id,name:me.name}];startHeartbeat();
    history.replaceState(null,"",location.pathname+location.search+"#"+code);
    renderLobby();
  });
  peer.on("connection",conn=>{
    conn.on("data",d=>hostRecv(conn.peer,d,conn));
    conn.on("close",()=>hostDrop(conn.peer));
    conn.on("error",()=>hostDrop(conn.peer));
  });
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  peer.on("error",err=>{
    if(err.type==="unavailable-id"&&tries<5){peer.destroy();createRoom(tries+1);return}
    if(net&&net.peer===peer&&["peer-unavailable","webrtc"].includes(err.type))return;
    peer.destroy();net=null;renderHome(netErrorText(err));
  });
}
function netErrorText(err){
  if(err.type==="network"||err.type==="server-error"||err.type==="socket-error"||err.type==="socket-closed")return "接続サーバーにつながりませんでした。ネットワークを確認して、もう一度試してください。";
  if(err.type==="browser-incompatible")return "このブラウザはP2P通信に対応していません。Chrome、Edge、Safari、Firefoxの最新版を使ってください。";
  return "接続できませんでした("+err.type+")。もう一度試してください。";
}

// Heartbeat: the host pings every 4s; anyone silent for 20s is treated as gone (tabs closed without a goodbye)
const HEARTBEAT=4000,SILENCE=20000;
let beatId=null;
const lastSeen=new Map();
function startHeartbeat(){
  clearInterval(beatId);
  beatId=setInterval(()=>{
    if(!net){clearInterval(beatId);return}
    if(net.isHost){
      net.conns.forEach((c,id)=>{try{c.send({t:"ping"})}catch(e){}
        if(Date.now()-(lastSeen.get(id)||Date.now())>SILENCE){try{c.close()}catch(e){}hostDrop(id)}});
    }else{
      try{net.host.send({t:"pong"})}catch(e){}
      if(Date.now()-(lastSeen.get("host")||Date.now())>SILENCE)lostHost();
    }},HEARTBEAT);
}
function hostRecv(from,d,conn){
  if(!d||typeof d!=="object")return;
  if(from!==me.id)lastSeen.set(from,Date.now());
  if(d.t==="pong")return;
  const pi=L.players.findIndex(p=>p.id===from);
  if(d.t==="hello"){
    if(conn){
      if(H){conn.on("open",()=>{});sendRaw(conn,{t:"refused",reason:"この部屋はゲームの途中です。終わるまで待ってから入り直してください。"});return}
      if(L.players.length>=MAX_PLAYERS){sendRaw(conn,{t:"refused",reason:"この部屋は満員です(8人まで)。"});return}
      net.conns.set(from,conn);lastSeen.set(from,Date.now());
      if(pi<0)L.players.push({id:from,name:String(d.name||"修復士").slice(0,10)});
    }
    hostLobbyChanged();return;
  }
  if(!H||pi<0)return;
  const gi=H.players.findIndex(p=>p.id===from);if(gi<0)return;
  if(d.t==="tile"&&H.phase==="draw"){const c=d.cell|0;if(H.owner[c]===gi&&isPng(d.png))H.tiles[c]=d.png}
  if(d.t==="drawDone"&&H.phase==="draw"){H.drawDone.add(from);hostProgress();hostCheckDrawn()}
  if(d.t==="guess"&&H.phase==="guess"&&Array.isArray(d.cells)){
    H.guesses[gi]=[...new Set(d.cells.map(x=>x|0))].filter(c=>c>=0&&c<H.N*H.N&&H.owner[c]!==gi).slice(0,H.need[gi]);
    hostProgress();hostCheckGuessed()}
}
function sendRaw(conn,msg){const go=()=>{try{conn.send(msg)}catch(e){}setTimeout(()=>{try{conn.close()}catch(e){}},500)};conn.open?go():conn.on("open",go)}

function hostDrop(id){
  if(!net||!net.isHost)return;
  net.conns.delete(id);
  const before=L.players.length;L.players=L.players.filter(p=>p.id!==id);
  if(before===L.players.length)return;
  if(!H){hostLobbyChanged();return}
  H.left.add(id);hostProgress();
  if(H.phase==="draw")hostCheckDrawn();else if(H.phase==="guess")hostCheckGuessed();
}
// Keep settings valid for the current head count, then tell everyone
function hostLobbyChanged(){
  const s=L.settings,n=Math.max(2,L.players.length),w=workOf(s.work);
  while(!fits(n,1,s.grid,w)&&s.grid<6)s.grid++;
  while(!fits(n,s.per,s.grid,w)&&s.per>1)s.per--;
  broadcast({t:"lobby",players:L.players,settings:s,code:net.code});
}

/* ---------- Host: game ---------- */
function hostStart(){
  const s=L.settings,players=L.players.map(p=>({id:p.id,name:p.name})),n=players.length,work=workOf(s.work),N=s.grid;
  if(n<2||!fits(n,s.per,N,work))return;
  const owner=Array(N*N).fill(-1),plain=plainTiles(work,N);
  const pool=shuffle([...Array(N*N).keys()].filter(i=>!plain.has(i)));
  for(let p=0;p<n;p++)for(let k=0;k<s.per;k++)owner[pool[p*s.per+k]]=p;
  H={phase:"draw",settings:{...s},players,owner,N,work,tiles:{},drawDone:new Set(),guesses:{},need:{},left:new Set(),
     startedAt:Date.now()};
  // Deadline covers every tile's timer plus slack for slow devices and the intro screen
  H.timer=setTimeout(hostFinishDraw,(s.per*s.seconds+25)*1000);
  players.forEach((p,pi)=>sendTo(p.id,{t:"start",settings:H.settings,players,me:pi,myCells:owner.map((o,i)=>o===pi?i:-1).filter(i=>i>=0)}));
  hostProgress();
}
const present=()=>H.players.filter(p=>!H.left.has(p.id));
function hostProgress(){
  if(!H)return;
  const done=H.phase==="draw"?[...H.drawDone]:H.players.filter((p,gi)=>H.guesses[gi]).map(p=>p.id);
  broadcast({t:"progress",phase:H.phase,done,left:[...H.left]});
}
function hostCheckDrawn(){if(H&&H.phase==="draw"&&present().every(p=>H.drawDone.has(p.id)))hostFinishDraw()}
function hostFinishDraw(){
  if(!H||H.phase!=="draw")return;clearTimeout(H.timer);
  // A tile nobody delivered falls back to the original and stops counting as hand-drawn
  H.owner=H.owner.map((o,i)=>o>=0&&H.tiles[i]?o:-1);
  const board=H.owner.map((o,i)=>o>=0?H.tiles[i]:cropURL(H.work,H.N,i));
  const drawn=H.owner.filter(o=>o>=0).length;
  H.phase="guess";
  H.players.forEach((p,gi)=>{H.need[gi]=drawn-H.owner.filter(o=>o===gi).length});
  present().forEach(p=>{const gi=H.players.indexOf(p);sendTo(p.id,{t:"board",tiles:board,need:H.need[gi]})});
  hostProgress();
  H.timer=setTimeout(hostFinish,10*60*1000);
}
function hostCheckGuessed(){if(H&&H.phase==="guess"&&present().every(p=>H.guesses[H.players.indexOf(p)]))hostFinish()}
function hostFinish(){
  if(!H||H.phase!=="guess")return;clearTimeout(H.timer);H.phase="result";
  broadcast({t:"result",owner:H.owner,guesses:H.guesses,left:[...H.left]});
}
function hostBackToLobby(){if(H&&H.timer)clearTimeout(H.timer);H=null;broadcast({t:"toLobby"});hostLobbyChanged()}

/* ---------- Guest: joining ---------- */
function joinRoom(code){
  renderConnecting(`部屋 ${code} を探しています…`);
  const peer=new Peer(undefined,PEER_OPTS);
  let opened=false;
  const fail=m=>{if(net&&net.peer!==peer)return;try{peer.destroy()}catch(e){}net=null;renderHome(m)};
  const giveUp=setTimeout(()=>{if(!opened)fail(`部屋 ${code} につながりませんでした。コードを確認するか、ホストの通信環境によってはつながらないことがあります。`)},15000);
  peer.on("open",id=>{
    me.id=id;
    const conn=peer.connect(ROOM_PREFIX+code,{reliable:true});
    net={peer,isHost:false,code,host:conn};
    conn.on("open",()=>{opened=true;clearTimeout(giveUp);conn.send({t:"hello",name:me.name});lastSeen.set("host",Date.now());startHeartbeat();
      history.replaceState(null,"",location.pathname+location.search+"#"+code)});
    conn.on("data",guestRecv);
    conn.on("close",()=>{if(net&&net.host===conn)lostHost()});
  });
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  peer.on("error",err=>{
    if(err.type==="peer-unavailable"){clearTimeout(giveUp);fail(`部屋 ${code} が見つかりません。コードを確認してください。`);return}
    if(!opened){clearTimeout(giveUp);fail(netErrorText(err))}
  });
}
function lostHost(){
  if(screen==="lost")return;
  clearInterval(timerId);clearInterval(beatId);try{net.peer.destroy()}catch(e){}net=null;G=null;
  screen="lost";

/* ---------- Every player: messages ---------- */
function guestRecv(d){
  if(!d||typeof d!=="object")return;
  if(net&&!net.isHost)lastSeen.set("host",Date.now());
  if(d.t==="ping")return;
  if(d.t==="refused"){const r=String(d.reason||"参加できませんでした。");try{net.peer.destroy()}catch(e){}net=null;renderHome(r);return}
  if(d.t==="lobby"){
    L.players=(d.players||[]).slice(0,MAX_PLAYERS).map(p=>({id:String(p.id),name:String(p.name).slice(0,10)}));
    L.settings=cleanSettings(d.settings);
    if(!G)renderLobby();return}
  if(d.t==="toLobby"){clearInterval(timerId);G=null;renderLobby();return}
  if(d.t==="start"){
    const s=cleanSettings(d.settings),work=workOf(s.work),N=s.grid;
    G={work,N,cw:work.w/N,ch:work.h/N,per:s.per,seconds:s.seconds,guide:!!s.guide,peek:!!s.peek,
       players:d.players.map(p=>({id:String(p.id),name:String(p.name).slice(0,10)})),me:d.me|0,
       myCells:(d.myCells||[]).map(x=>x|0).filter(x=>x>=0&&x<N*N),done:[],left:[],board:null};
    renderIntro();return}
  if(!G)return;
  if(d.t==="progress"){G.done=d.done||[];G.left=d.left||[];G.phase=d.phase;
    if(screen==="wait")renderWait();return}
  if(d.t==="board"){
    if(!Array.isArray(d.tiles)||d.tiles.length!==G.N*G.N||!d.tiles.every(isPng))return;
    clearInterval(timerId);G.board=d.tiles;G.need=d.need|0;renderReveal();return}
  if(d.t==="result"){const np=G.players.length;
    G.owner=[...Array(G.N*G.N)].map((_,i)=>{const o=(d.owner||[])[i]|0;return o>=0&&o<np?o:-1});
    G.guesses={};Object.keys(d.guesses||{}).forEach(k=>{const gi=k|0;if(gi>=0&&gi<np&&Array.isArray(d.guesses[k]))G.guesses[gi]=d.guesses[k].map(x=>x|0)});
    G.left=d.left||[];renderResult();return}
}

  document.getElementById("leave").onclick=leaveRoom;

    try{await navigator.clipboard.writeText(link);b.textContent="コピーしました"}catch(e){inp.select();b.textContent="選択しました。コピーしてください"}};
  if(!host)return;
  const set=fn=>{fn(L.settings);hostLobbyChanged()};
  document.querySelectorAll(".work").forEach(b=>b.onclick=()=>set(s=>s.work=b.dataset.w));

/* ---------- Intro, drawing ---------- */
function renderIntro(){
  screen="intro";
  let left=5;
  h(`<section class="pass">
    <span class="eyebrow">修復開始</span>
    <div class="who">${dot(G.me,"0.45em")} ${esc(G.players[G.me].name)} さん</div>
    <p class="ban">お題は「${esc(G.work.title)}」。あなたの担当は ${G.myCells.length}マス、1マスの制限時間は ${G.seconds}秒です。描画サポート:補助線 ${G.guide?"オン":"オフ"} · 隣のマス ${G.peek?"オン":"オフ"}</p>
    <button class="primary" id="go" style="font-size:17px;padding:14px 28px">描きはじめる(<span id="cd">${left}</span>)</button>
  </section>`);
  const go=()=>{clearInterval(timerId);startDrawing()};
  document.getElementById("go").onclick=go;
  clearInterval(timerId);
  timerId=setInterval(()=>{left--;const e=document.getElementById("cd");if(e)e.textContent=left;if(left<=0)go()},1000);

function startDrawing(){
  const cells=shuffle(G.myCells.slice());let idx=0;G.guideShown=true;
  const next=()=>{if(G.board)return;
    if(idx<cells.length)drawCell(cells[idx],idx,cells.length,png=>{toHost({t:"tile",cell:cells[idx],png});idx++;next()});
    // Show the waiting screen first: when the host is the last to finish, the next screen arrives synchronously
    else{screen="wait";renderWait();toHost({t:"drawDone"})}};
  next();
}

function drawCell(cell,k,total,done){
  screen="draw";
  const N=G.N,cw=G.cw,ch=G.ch,r=Math.floor(cell/N),c=cell%N,w=G.work,ar=`${w.w}/${w.h}`;
  const PAPER=w.palette.slice().sort((a,b)=>lum(b)-lum(a))[0];
  const probe=document.createElement("canvas");probe.width=cw;probe.height=ch;
  const pc=probe.getContext("2d",{willReadFrequently:true});pc.imageSmoothingEnabled=false;
  pc.drawImage(loaded[w.id],c*cw,r*ch,cw,ch,0,0,cw,ch);
  const local=tileColors(pc.getImageData(0,0,cw,ch).data,w.palette);
  const others=w.palette.filter(x=>!local.includes(x));
  const swatch=col=>`<button class="sw" style="background:${col}" data-c="${col}" aria-label="色 ${col}" aria-pressed="false"></button>`;
  const m=G.peek?Math.round(Math.min(cw,ch)*.18):0,FW=cw+2*m,FH=ch+2*m;
  const place=`left:${m/FW*100}%;top:${m/FH*100}%;width:${cw/FW*100}%;height:${ch/FH*100}%`;
  const tileBox=(id,label,bg)=>`<div class="frame" style="padding:6px${bg?";background:"+bg:""}"><div class="inner box${m?" peek":""}" style="aspect-ratio:${FW}/${FH}">
      ${m?`<canvas class="pix ctx" width="${FW}" height="${FH}"></canvas>`:""}
      <canvas class="pix tile" id="${id}" width="${cw}" height="${ch}" style="${place}" aria-label="${label}"></canvas>
      ${G.guide?`<div class="guide" style="${place}" ${G.guideShown?"":"hidden"}></div>`:""}
    </div></div>`;
  const sizes=[1,Math.max(2,Math.round(cw*.03)),Math.max(3,Math.round(cw*.07)),Math.max(5,Math.round(cw*.15))];
  h(`
  <div class="drawhead">
    <span class="label">${dot(G.me,9)} ${esc(G.players[G.me].name)} · ${k+1} / ${total}マス目</span>
    <div class="timer" id="timer"><div class="bar"><i id="barfill"></i></div><output id="tleft">${G.seconds}</output></div>
    <button class="primary" id="done">${k+1<total?"このマスを完成":"描き終える"}</button>
  </div>
  <section class="stage">
    <div class="col">
      ${tileBox("ref",`お手本 ${cellName(cell,N)}`)}
      <div class="refmeta">
        <div class="mini"><img class="pix" src="${w.src}" alt="" style="aspect-ratio:${ar}"><div class="hl" style="left:${c*100/N}%;top:${r*100/N}%;width:${100/N}%;height:${100/N}%"></div></div>
        <div><span class="label">お手本</span><div class="cellname">${cellName(cell,N)}</div></div>
      </div>
      <p class="hint">お手本をタップすると、その場所の色に切り替わります</p>
    </div>
    <div class="col">
      ${tileBox("pad","あなたのキャンバス","#3a2e22")}
    </div>
  </section>
  <div class="tools">
    <div class="paintbox">
      <span class="label">このマスの絵の具 · ${local.length}色</span>
      <div class="swatches">${local.map(swatch).join("")}${others.length?`<button class="more" id="more" aria-expanded="false">ほかの色 +${others.length}</button>`:""}</div>
    </div>
    <div class="sizes" id="sizes">${sizes.map((s,i)=>`<button data-s="${s}" aria-label="太さ ${s}ドット" aria-pressed="${i===1}"><i style="width:${[3,7,13,22][i]}px;height:${[3,7,13,22][i]}px"></i></button>`).join("")}</div>
    <span class="spacer"></span>
    ${G.guide?`<button class="tool" id="guideBtn" aria-pressed="${G.guideShown}">補助線</button>`:""}
    <button class="tool" id="bucket" aria-pressed="false">バケツ</button>
    <button class="tool" id="eraser" aria-pressed="false">消しゴム</button>
    <button id="undo">元に戻す</button>
    <button id="fill">全面を塗る</button>
    <div class="otherbox" id="otherbox" hidden>
      <span class="label">ほかの色(このマスにはほとんど出てこない色)</span>
      ${colorFamilies(others).map(f=>`<div class="famrow"><span class="famname">${f.name}</span><div class="swatches">${f.colors.map(swatch).join("")}</div></div>`).join("")}
    </div>
  </div>`);

  const ref=document.getElementById("ref"),rc=ref.getContext("2d",{willReadFrequently:true});
  rc.imageSmoothingEnabled=false;rc.drawImage(loaded[w.id],c*cw,r*ch,cw,ch,0,0,cw,ch);
  if(m)document.querySelectorAll("canvas.ctx").forEach(cv=>{const x=cv.getContext("2d");x.imageSmoothingEnabled=false;
    x.fillStyle="#000";x.fillRect(0,0,FW,FH);
    const sx=Math.max(0,c*cw-m),sy=Math.max(0,r*ch-m),ex=Math.min(w.w,(c+1)*cw+m),ey=Math.min(w.h,(r+1)*ch+m);
    x.drawImage(loaded[w.id],sx,sy,ex-sx,ey-sy,sx-(c*cw-m),sy-(r*ch-m),ex-sx,ey-sy)});
  const pad=document.getElementById("pad"),ctx=pad.getContext("2d",{willReadFrequently:true});
  ctx.imageSmoothingEnabled=false;ctx.fillStyle=PAPER;ctx.fillRect(0,0,cw,ch);
  let color=local[0],size=sizes[1],erasing=false;const undo=[];
  const swBtns=[...document.querySelectorAll(".sw")],eraserBtn=document.getElementById("eraser");
  const guideBtn=document.getElementById("guideBtn");
  if(guideBtn)guideBtn.onclick=()=>{G.guideShown=!G.guideShown;guideBtn.setAttribute("aria-pressed",String(G.guideShown));
    document.querySelectorAll(".guide").forEach(g=>g.hidden=!G.guideShown)};
  const moreBtn=document.getElementById("more"),otherBox=document.getElementById("otherbox");
  const showOthers=open=>{if(!moreBtn)return;otherBox.hidden=!open;moreBtn.setAttribute("aria-expanded",String(open));
    moreBtn.textContent=open?"ほかの色を閉じる":`ほかの色 +${others.length}`};
  if(moreBtn)moreBtn.onclick=()=>showOthers(otherBox.hidden);
  const setColor=col=>{color=col;erasing=false;eraserBtn.setAttribute("aria-pressed","false");
    swBtns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.c===col)));
    if(others.includes(col))showOthers(true)};
  setColor(color);
  swBtns.forEach(b=>b.onclick=()=>setColor(b.dataset.c));
  document.querySelectorAll("#sizes button").forEach(b=>b.onclick=()=>{size=+b.dataset.s;document.querySelectorAll("#sizes button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});
  eraserBtn.onclick=()=>{erasing=!erasing;eraserBtn.setAttribute("aria-pressed",String(erasing))};
  // Bucket: fills the connected area of the tapped color. With the eraser on, it clears that area instead
  let bucketOn=false;const bucketBtn=document.getElementById("bucket");
  bucketBtn.onclick=()=>{bucketOn=!bucketOn;bucketBtn.setAttribute("aria-pressed",String(bucketOn))};
  const bucketFill=(fx,fy)=>{
    const sx=Math.floor(fx),sy=Math.floor(fy);if(sx<0||sy<0||sx>=cw||sy>=ch)return false;
    const img=ctx.getImageData(0,0,cw,ch).data,k0=(sy*cw+sx)*4,tr=img[k0],tg=img[k0+1],tb=img[k0+2];
    const fillHex=erasing?PAPER:color,[fr,fg,fb]=rgbOf(fillHex);
    // A small tolerance keeps the fill working where a browser adds noise to pixel reads
    const near=(r,g,b,R,G,B)=>(r-R)**2+(g-G)**2+(b-B)**2<=108;
    if(near(tr,tg,tb,fr,fg,fb))return false;
    const same=p=>{const k=p*4;return near(img[k],img[k+1],img[k+2],tr,tg,tb)};
    const seen=new Uint8Array(cw*ch),stack=[sy*cw+sx];
    ctx.fillStyle=fillHex;
    while(stack.length){
      const p=stack.pop();if(seen[p])continue;
      const y=Math.floor(p/cw);let xl=p%cw,xr=xl;
      while(xl>0&&!seen[y*cw+xl-1]&&same(y*cw+xl-1))xl--;
      while(xr<cw-1&&!seen[y*cw+xr+1]&&same(y*cw+xr+1))xr++;
      for(let x=xl;x<=xr;x++){seen[y*cw+x]=1;
        if(y>0){const q=(y-1)*cw+x;if(!seen[q]&&same(q))stack.push(q)}
        if(y<ch-1){const q=(y+1)*cw+x;if(!seen[q]&&same(q))stack.push(q)}}
      ctx.fillRect(xl,y,xr-xl+1,1);
    }
    return true;
  };
  // Undo keeps canvas copies rather than pixel reads, so no browser noise sneaks into the drawing
  const pushUndo=()=>{const c2=document.createElement("canvas");c2.width=cw;c2.height=ch;c2.getContext("2d").drawImage(pad,0,0);
    undo.push(c2);if(undo.length>40)undo.shift()};
  document.getElementById("undo").onclick=()=>{const c2=undo.pop();if(c2){ctx.clearRect(0,0,cw,ch);ctx.drawImage(c2,0,0)}};
  document.getElementById("fill").onclick=()=>{pushUndo();ctx.fillStyle=erasing?PAPER:color;ctx.fillRect(0,0,cw,ch)};
  ref.addEventListener("pointerdown",e=>{
    const b=ref.getBoundingClientRect();
    const x=Math.max(0,Math.min(cw-1,Math.floor((e.clientX-b.left)/b.width*cw))),y=Math.max(0,Math.min(ch-1,Math.floor((e.clientY-b.top)/b.height*ch)));
    // Read a 3×3 patch and take the paint color most of it snaps to
    const x0=Math.max(0,x-1),y0=Math.max(0,y-1),x1=Math.min(cw-1,x+1),y1=Math.min(ch-1,y+1);
    const d=rc.getImageData(x0,y0,x1-x0+1,y1-y0+1).data,near=nearestOf(w.palette),votes=new Array(w.palette.length).fill(0);
    for(let i=0;i<d.length;i+=4)votes[near(d[i],d[i+1],d[i+2])]++;
    const center=near(...rc.getImageData(x,y,1,1).data.slice(0,3));
    let best=center;votes.forEach((v,i)=>{if(v>votes[best])best=i});
    setColor(w.palette[best]);
  });
  const stamp=(x,y)=>{const spans=discSpans(size),ox=Math.round(x-size/2),oy=Math.round(y-size/2);
    for(const [dy,dx,len] of spans)ctx.fillRect(ox+dx,oy+dy,len,1)};
  const line=(a,b)=>{const n=Math.max(1,Math.ceil(Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y))));
    for(let i=1;i<=n;i++)stamp(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n)};
  let drawing=false,last=null;
  const pos=e=>{const b=pad.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*cw,y:(e.clientY-b.top)/b.height*ch}};
  pad.addEventListener("pointerdown",e=>{e.preventDefault();
    if(bucketOn){pushUndo();const pt=pos(e);if(!bucketFill(pt.x,pt.y))undo.pop();return}
    pad.setPointerCapture(e.pointerId);pushUndo();drawing=true;last=pos(e);
    ctx.fillStyle=erasing?PAPER:color;stamp(last.x,last.y)});
  pad.addEventListener("pointermove",e=>{if(!drawing)return;ctx.fillStyle=erasing?PAPER:color;
    const pts=e.getCoalescedEvents?e.getCoalescedEvents():[];
    for(const ev of pts.length?pts:[e]){const pt=pos(ev);line(last,pt);last=pt}});
  const end=()=>{drawing=false};
  pad.addEventListener("pointerup",end);pad.addEventListener("pointercancel",end);

  const t0=performance.now(),limit=G.seconds*1000,fillEl=document.getElementById("barfill"),out=document.getElementById("tleft"),tbox=document.getElementById("timer");
  let finished=false;
  const finish=()=>{if(finished)return;finished=true;clearInterval(timerId);drawing=false;done(pad.toDataURL("image/png"))};
  clearInterval(timerId);
  timerId=setInterval(()=>{const left=Math.max(0,limit-(performance.now()-t0));
    out.textContent=Math.ceil(left/1000);fillEl.style.width=(left/limit*100)+"%";
    tbox.classList.toggle("hurry",left<=10000);if(left<=0)finish()},200);
  document.getElementById("done").onclick=finish;
}

/* ---------- Waiting ---------- */
function renderWait(){
  const draw=G.phase!=="guess"&&!G.board;
  const done=new Set(G.done),left=new Set(G.left);
  const active=G.players.filter(p=>!left.has(p.id));
  h(`<section class="pass">
    <span class="eyebrow">${draw?"修復作業中":"推理中"}</span>

    <p class="ban">${active.filter(p=>done.has(p.id)).length} / ${active.length}人が${draw?"描き終えました":"推理を確定しました"}</p>
    <div class="roster" style="width:100%;max-width:640px">${G.players.map((p,i)=>`<div class="member ${done.has(p.id)?"done":""}">${dot(i)}<span class="nm">${esc(p.name)}</span><small>${left.has(p.id)?"退出":done.has(p.id)?"完了":"作業中"}</small></div>`).join("")}</div>
  </section>`);
}

/* ---------- Board ---------- */
function boardHTML(tiles,opts={}){

    return `<button class="cell ${opts.flip?"flip":""} ${opts.locked&&opts.locked(i)?"locked":""} ${opts.picked&&opts.picked(i)?"picked":""}" data-i="${i}" style="${opts.flip?`animation-delay:${opts.order.indexOf(i)*Math.round(1800/(N*N))}ms`:""}" aria-label="マス ${cellName(i,N)}" ${opts.clickable?"":"tabindex='-1'"}>
      <img src="${esc(d)}" alt=""><span class="coord">${cellName(i,N)}</span>${opts.tag?opts.tag(i):""}${opts.mark?opts.mark(i):""}</button>`}).join("")}</div></div></div>`;
}
function renderReveal(){

/* ---------- Guess ---------- */
function renderGuess(){
  screen="guess";
  const need=G.need,picked=new Set(),mine=new Set(G.myCells);
  const paint=()=>{
    h(`<div style="display:flex;flex-direction:column;gap:4px">
        <span class="eyebrow">推理 · ${esc(G.players[G.me].name)} さん</span>
        <h2>手描きのマスはどれ?</h2></div>
      <section class="two">
        <div class="boardwrap">${boardHTML(G.board,{clickable:true,locked:i=>mine.has(i),picked:i=>picked.has(i),
          tag:i=>mine.has(i)?`<span class="tag" style="background:${PLAYER_COLORS[G.me]}">自分</span>`
            :picked.has(i)?`<span class="tag" style="background:var(--gilt)">手描き?</span>`:""})}</div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <p class="muted">ほかの人が描いたと思うマスを ${need}枚タップしてください。もう一度タップすると選択を外せます。斜線のマスはあなたが描いた場所です。</p>
          <p class="bignum">${picked.size} <span class="muted" style="font-size:.55em">/ ${need}枚</span></p>
          <button class="primary" id="ok" ${picked.size===need?"":"disabled"}>推理を確定する</button>
        </div>
      </section>`);
    document.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(mine.has(i))return;
      if(picked.has(i))picked.delete(i);else if(picked.size<need)picked.add(i);else return;
      const y=window.scrollY;paint();window.scrollTo(0,y)});
    document.getElementById("ok").onclick=()=>{G.phase="guess";screen="wait";renderWait();toHost({t:"guess",cells:[...picked]})};
  };
  paint();
}

/* ---------- Result ---------- */
function score(){
  const owner=G.owner,guess=gi=>new Set(G.guesses[gi]||[]),voters=G.players.map((_,gi)=>gi).filter(gi=>G.guesses[gi]);
  return G.players.map((p,gi)=>{
    if(!G.guesses[gi])return null;
    let hit=0;guess(gi).forEach(c=>{if(owner[c]>=0&&owner[c]!==gi)hit++});
    let hidden=0;owner.forEach((o,c)=>{if(o===gi)voters.forEach(g=>{if(g!==gi&&!guess(g).has(c))hidden++})});
    return{i:gi,name:p.name,hit,hidden,total:hit+hidden};
  }).filter(Boolean);
}
function renderResult(showOriginal=false){
  screen="result";
  const rows=score().sort((a,b)=>b.total-a.total),best=rows.length?rows[0].total:0;
  const voters=G.players.map((_,gi)=>gi).filter(gi=>G.guesses[gi]);
  const votes=c=>voters.filter(g=>g!==G.owner[c]&&(G.guesses[g]||[]).includes(c)).length;
  const others=c=>voters.filter(g=>g!==G.owner[c]).length;
  const tiles=showOriginal?G.board.map((_,i)=>cropURL(G.work,G.N,i)):G.board;
  const host=net&&net.isHost;
  h(`<div style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">答え合わせ</span><h2>結果発表</h2></div>
  <section class="two">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="boardwrap">${boardHTML(tiles,{
        tag:i=>{const o=G.owner[i];return o>=0?`<span class="tag" style="background:${PLAYER_COLORS[o]}">${esc(G.players[o].name)}</span>`:""},
        mark:i=>{const o=G.owner[i],v=votes(i);return o>=0?`<span class="mark">見破り ${v}/${others(i)}</span>`:v?`<span class="mark">誤選択 ${v}</span>`:""}})}</div>
      <button id="cmp">${showOriginal?"合作に戻す":"原画と見比べる"}</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="tablewrap"><table>
        <thead><tr><th>プレイヤー</th><th>的中</th><th>逃げ切り</th><th>合計</th></tr></thead>
        <tbody>${rows.map(r=>`<tr class="${r.total===best?"top":""}"><td>${dot(r.i)} ${esc(r.name)}${r.i===G.me?"(あなた)":""}</td><td>${r.hit}</td><td>${r.hidden}</td><td class="total">${r.total}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="hint">的中:選んだマスのうち手描きだった数(+1点ずつ)/ 逃げ切り:自分のマスを選ばなかった人の数を、担当マスごとに合計(+1点ずつ)</p>
      <div class="row">
        ${host?`<button class="primary" id="again">ロビーに戻って次のゲームへ</button>`:`<p class="muted">ホストが次のゲームを準備するまでお待ちください。</p>`}
        <button id="leave">部屋を出る</button>
      </div>
    </div>
  </section>`);
  document.getElementById("cmp").onclick=()=>renderResult(!showOriginal);
  if(host)document.getElementById("again").onclick=hostBackToLobby;
  document.getElementById("leave").onclick=leaveRoom;
}

window.addEventListener("beforeunload",()=>{if(net&&net.peer)try{net.peer.destroy()}catch(e){}});
loadImages().then(()=>{
  if(typeof Peer==="undefined"){renderHome("通信ライブラリを読み込めませんでした。ネットワークを確認してページを再読み込みしてください。");return}
  renderHome();
});
</script>
</body>
</html>
